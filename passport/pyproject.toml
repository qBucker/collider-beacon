[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pp-audit"
version = "0.1.0"
description = "Precision-passport audit for public data products"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy", "scipy"]

[project.scripts]
pp-audit = "pp_audit.cli:main"

[tool.setuptools]
packages = ["pp_audit"]
